name: Build Okular

on:
  push:
  pull_request:

jobs:
  build-linux:
    name: Build Linux (Binaries + .deb)
    runs-on: ubuntu-latest
    container:
      image: kdeneon/plasma:user
      options: --user root
    steps:
    - name: Install Git & Basic Tools
      run: |
        apt-get update
        apt-get install -y git tar
    - uses: actions/checkout@v4
    - name: Create Source Tarball
      run: |
        git config --global --add safe.directory '*'
        git archive --format=tar.gz --output=okular-source.tar.gz HEAD
    - name: Upload Source Artifact
      uses: actions/upload-artifact@v4
      with:
        name: okular-source
        path: okular-source.tar.gz
    
    - name: Install Build Dependencies
      run: |
        apt-get install -y build-essential cmake extra-cmake-modules \
          qt6-base-dev qt6-svg-dev qt6-declarative-dev qt6-tools-dev qt6-5compat-dev qt6-speech-dev \
          libkf6archive-dev libkf6bookmarks-dev libkf6completion-dev libkf6config-dev libkf6configwidgets-dev \
          libkf6coreaddons-dev libkf6i18n-dev libkf6kio-dev libkf6parts-dev libkf6windowsystem-dev libkf6xmlgui-dev \
          libkf6threadweaver-dev libkf6colorscheme-dev libkf6crash-dev libkf6iconthemes-dev libkf6textwidgets-dev \
          libkf6widgetsaddons-dev \
          libpoppler-qt6-dev libphonon4qt6-dev liblcms2-dev libtiff-dev libfreetype-dev \
          libspectre-dev libzip-dev djvulibre-bin libdjvulibre-dev \
          libkexiv2-dev libjpeg-dev libpng-dev libdiscount-dev

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
    
    - name: Package .deb
      run: |
        cd build
        cpack -G DEB

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: okular-linux-bin
        path: build/bin/

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: okular-deb
        path: build/*.deb

  flatpak:
    name: Build Flatpak
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
    - name: Download Source
      uses: actions/download-artifact@v4
      with:
        name: okular-source
    - name: Extract Source
      run: tar xf okular-source.tar.gz
    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: okular.flatpak
        manifest-path: .flatpak-manifest.json
        cache-key: flatpak-builder-${{ github.sha }}
        repository-name: okular-nightly
        repository-url: https://nightly.kde.org/flatpak/okular-nightly/
    - name: Upload Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: okular-flatpak
        path: okular.flatpak

  build-windows:
    name: Build EXE (Windows)
    needs: build-linux
    runs-on: windows-latest
    steps:
    - name: Download Source
      uses: actions/download-artifact@v4
      with:
        name: okular-source
    - name: Extract Source
      run: tar xf okular-source.tar.gz
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: C:/Craft
        key: ${{ runner.os }}-craft-${{ hashFiles('**/CMakeLists.txt') }}
    - name: Set up Craft
      uses: kde/craft-setup-action@v1
    - name: Build Okular with Craft
      run: |
        craft --install-deps okular
        craft okular
    - name: Package Okular
      run: craft --package okular
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: okular-windows-exe
        path: C:/Craft/dist/*.exe
