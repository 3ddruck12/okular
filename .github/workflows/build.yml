name: Build Okular

on:
  push:
  pull_request:

jobs:
  build-linux:
    name: Build Linux (Binaries + .deb)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.10
      options: --user root
    steps:
    - name: Prepare Container & Dependencies (KDE GitLab Style)
      run: |
        # Enable source repositories and switch to old-releases (KDE CI workaround)
        sed -i 's/ deb/ deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sed -i 's/archive.ubuntu.com/old-releases.ubuntu.com/' /etc/apt/sources.list.d/ubuntu.sources
        sed -i 's/security.ubuntu.com/old-releases.ubuntu.com/' /etc/apt/sources.list.d/ubuntu.sources
        
        apt-get update
        
        # Install eatmydata for speed and essential tools
        apt-get install -y eatmydata git tar build-essential cmake extra-cmake-modules
        
        # Install build dependencies for Okular using eatmydata
        export DEBIAN_FRONTEND=noninteractive
        eatmydata apt-get build-dep -y --no-install-recommends okular
        
    - uses: actions/checkout@v4
    
    - name: Create Source Tarball
      run: |
        git config --global --add safe.directory '*'
        git archive --format=tar.gz --output=okular-source.tar.gz HEAD
        
    - name: Upload Source Artifact
      uses: actions/upload-artifact@v4
      with:
        name: okular-source
        path: okular-source.tar.gz

    - name: Configure CMake
      run: |
        # Workaround for CPack expecting 'COPYING'
        cp LICENSES/GPL-2.0-or-later.txt COPYING
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
    
    - name: Package .deb
      run: |
        cd build
        eatmydata cpack -G DEB

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: okular-linux-bin
        path: build/bin/

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: okular-deb
        path: build/*.deb

  flatpak:
    name: Build Flatpak
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
    - name: Download Source
      uses: actions/download-artifact@v4
      with:
        name: okular-source
    - name: Extract Source
      run: tar xf okular-source.tar.gz
    - name: Install Flatpak Builder
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
    - name: Build Flatpak
      run: |
        # Add necessary remotes with sudo - using cdn.kde.org for better reliability
        sudo flatpak remote-add --if-not-exists --system flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        sudo flatpak remote-add --if-not-exists --system kde https://cdn.kde.org/flatpak/kde-runtime-nightly/
        sudo flatpak remote-add --if-not-exists --system okular-nightly https://cdn.kde.org/flatpak/okular-nightly/
        
        # Build using flatpak-builder with sudo to handle dependency installation
        # We try installing deps from okular-nightly first, then kde, then flathub
        sudo flatpak-builder --repo=repo --force-clean build-dir .flatpak-manifest.json --install-deps-from=okular-nightly --install-deps-from=kde --install-deps-from=flathub --default-branch=master
        
        # Create the bundle
        sudo flatpak build-bundle repo okular.flatpak org.kde.okular
    - name: Upload Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: okular-flatpak
        path: okular.flatpak

  build-windows:
    name: Build EXE (Windows)
    needs: build-linux
    runs-on: windows-latest
    steps:
    - name: Download Source
      uses: actions/download-artifact@v4
      with:
        name: okular-source
    - name: Extract Source
      run: tar xf okular-source.tar.gz
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: C:/Craft
        key: ${{ runner.os }}-craft-${{ hashFiles('**/CMakeLists.txt') }}
    - name: Set up Craft
      run: |
        Set-ExecutionPolicy -Scope CurrentUser RemoteSigned
        $env:CraftCI = "1"
        iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/KDE/craft/master/setup/install_craft.ps1'))
      shell: powershell
    - name: Build Okular with Craft
      run: |
        # Craft environment setup is tricky in CI, calling craft directly if in path or via python script
        # Assuming install_craft.ps1 puts craft in path or we need to source it.
        # Often easier to use the craft wrapper. 
        # Re-using the logic from typical KDE setups:
        C:\CraftRoot\craft\bin\craft.ps1 --install-deps okular
        C:\CraftRoot\craft\bin\craft.ps1 okular
      shell: powershell
    - name: Package Okular
      run: |
        C:\CraftRoot\craft\bin\craft.ps1 --package okular
      shell: powershell
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: okular-windows-exe
        path: C:/Craft/dist/*.exe
