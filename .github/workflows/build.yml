name: Build Okular

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          extra-cmake-modules \
          qt6-base-dev \
          libkf6config-dev \
          libkf6coreaddons-dev \
          libkf6i18n-dev \
          libkf6kio-dev \
          libkf6bookmarks-dev \
          libkf6xmlgui-dev \
          libpoppler-qt6-dev \
          libkf6parts-dev \
          libkf6windowsystem-dev \
          libkf6textwidgets-dev \
          libkf6crash-dev \
          libkf6iconthemes-dev \
          libkf6wallet-dev \
          libkf6doctools-dev \
          libkf6archive-dev \
          libkf6threadweaver-dev \
          libphonon4qt6-dev \
          libpoppler-dev \
          libfreetype-dev \
          libtiff-dev \
          libspectre-dev \
          libzip-dev \
          zlib1g-dev \
          libdjvulibre-dev \
          libepub-dev \
          libqmobipocket6-dev \
          libmarkdown2-dev \
          libqt6svg6-dev \
          gettext

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
