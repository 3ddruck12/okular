name: Build Okular

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    - name: Install Prerequisites
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git

    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          cmake \
          pkgconf \
          extra-cmake-modules \
          qt6-base \
          qt6-svg \
          qt6-declarative \
          qt6-tools \
          qt6-5compat \
          qt6-speech \
          kf6 \
          poppler-qt6 \
          phonon-qt6 \
          libkexiv2 \
          freetype2 \
          libtiff \
          libspectre \
          libzip \
          zlib \
          djvulibre \
          kdegraphics-mobipocket \
          discount \
          ebook-tools \
          libjpeg-turbo \
          libpng \
          lcms2

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: okular-build
        path: build/bin/
