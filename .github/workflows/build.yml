name: Build Okular

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    - name: Install Prerequisites
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git

    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          cmake \
          extra-cmake-modules \
          qt6-base \
          qt6-svg \
          qt6-declarative \
          qt6-tools \
          qt6-5compat \
          kconfig \
          kcoreaddons \
          ki18n \
          kio \
          kbookmarks \
          kxmlgui \
          kparts \
          kwindowsystem \
          ktextwidgets \
          kcrash \
          kiconthemes \
          kwallet \
          kdoctools \
          karchive \
          threadweaver \
          kcolorscheme \
          purpose \
          poppler-qt6 \
          phonon-qt6 \
          freetype2 \
          libtiff \
          libspectre \
          libzip \
          zlib \
          djvulibre \
          kdegraphics-mobipocket \
          discount \
          ebook-tools

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
