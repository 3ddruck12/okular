name: Build Okular

on:
  push:
  pull_request:

jobs:
  build-linux:
    name: Build Linux (Binaries + .deb)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:rolling
      options: --user root
    steps:
    - name: Prepare Container & Dependencies
      run: |
        # Enable source repositories
        sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources || sed -i 's/^#\s*deb-src/deb-src/' /etc/apt/sources.list
        
        apt-get update
        apt-get install -y git tar build-essential cmake extra-cmake-modules
        
        # Install build dependencies for Okular (pulls in KF6/Qt6)
        export DEBIAN_FRONTEND=noninteractive
        apt-get build-dep -y okular
    - uses: actions/checkout@v4
    - name: Create Source Tarball
      run: |
        git config --global --add safe.directory '*'
        git archive --format=tar.gz --output=okular-source.tar.gz HEAD
    - name: Upload Source Artifact
      uses: actions/upload-artifact@v4
      with:
        name: okular-source
        path: okular-source.tar.gz

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
    
    - name: Package .deb
      run: |
        cd build
        cpack -G DEB

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: okular-linux-bin
        path: build/bin/

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: okular-deb
        path: build/*.deb

  flatpak:
    name: Build Flatpak
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
    - name: Download Source
      uses: actions/download-artifact@v4
      with:
        name: okular-source
    - name: Extract Source
      run: tar xf okular-source.tar.gz
    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: okular.flatpak
        manifest-path: .flatpak-manifest.json
        cache-key: flatpak-builder-${{ github.sha }}
        repository-name: okular-nightly
        repository-url: https://nightly.kde.org/flatpak/okular-nightly/
    - name: Upload Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: okular-flatpak
        path: okular.flatpak

  build-windows:
    name: Build EXE (Windows)
    needs: build-linux
    runs-on: windows-latest
    steps:
    - name: Download Source
      uses: actions/download-artifact@v4
      with:
        name: okular-source
    - name: Extract Source
      run: tar xf okular-source.tar.gz
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: C:/Craft
        key: ${{ runner.os }}-craft-${{ hashFiles('**/CMakeLists.txt') }}
    - name: Set up Craft
      uses: kde/craft-setup-action@v1
    - name: Build Okular with Craft
      run: |
        craft --install-deps okular
        craft okular
    - name: Package Okular
      run: craft --package okular
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: okular-windows-exe
        path: C:/Craft/dist/*.exe
