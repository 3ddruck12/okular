name: Build Okular

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    - name: Install Prerequisites
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git

    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          cmake \
          extra-cmake-modules \
          qt6-base \
          qt6-svg \
          qt6-declarative \
          qt6-tools \
          kf6-config \
          kf6-coreaddons \
          kf6-i18n \
          kf6-kio \
          kf6-bookmarks \
          kf6-xmlgui \
          kf6-parts \
          kf6-windowsystem \
          kf6-textwidgets \
          kf6-crash \
          kf6-iconthemes \
          kf6-wallet \
          kf6-doctools \
          kf6-archive \
          kf6-threadweaver \
          kf6-purpose \
          poppler-qt6 \
          phonon-qt6 \
          freetype2 \
          libtiff \
          libspectre \
          libzip \
          zlib \
          djvulibre \
          kdegraphics-mobipocket \
          discount \
          ebook-tools

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)
